# ESP32 node configuration for Rehab Robotics Bridge
#
# All nodes share the STEP_ESP32 WiFi AP (password: step1234).
# Host PC must be joined to STEP_ESP32 to reach these IPs.
#
# Network topology:
#   Master   starts Soft AP → SSID: STEP_ESP32, fixed IP: 192.168.4.1
#   Slave 1  joins STEP_ESP32 → DHCP IP: 192.168.4.2
#   Slave 2  joins STEP_ESP32 → DHCP IP: 192.168.4.3
#   Host PC  joins STEP_ESP32 → connects to each node's TCP :5000 directly
#
# Each node runs its own TCP server on port 5000.
# imu_aggregator_node opens one independent connection per entry.
#
# Topics published per node:
#   /esp32/{id}/imu   sensor_msgs/Imu         (quat + accel + gyro)
#   /esp32/{id}/raw   std_msgs/Float32MultiArray (14 ch, normalised)

nodes:
  - id: master
    host: 192.168.4.1
    port: 5000

  - id: slave_1
    host: 192.168.4.2
    port: 5000

  # - id: slave_2
  #   host: 192.168.4.3
  #   port: 5000

  # - id: slave_3
  #   host: 192.168.4.4
  #   port: 5000
